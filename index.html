    <script>
      // iOS Safari's "Add to Home Screen" reads the manifest during initial
      // HTML parsing — a React effect that swaps the <link> after the app
      // has mounted and an async role check has resolved runs far too late
      // to affect it (confirmed on-device: the share-sheet preview still
      // showed the default target even with a brand-new, never-before-seen
      // manifest URL, ruling out a caching explanation on its own). This
      // runs synchronously, before the browser parses anything past it, off
      // a flag the app writes to localStorage once it knows the signed-in
      // user's role — so on every load *after* the first, the correct
      // manifest is already linked before Safari ever looks at it.
      (function () {
        try {
          if (localStorage.getItem("elite-pwa-role") === "admin") {
            var link = document.getElementById("app-manifest-link");
            if (link) link.setAttribute("href", "/manifest-admin.webmanifest?r=admin");
            var title = document.getElementById("app-web-app-title");
            if (title) title.setAttribute("content", "EliteSwap Admin");
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Companion to public/404.html — restores the real path GitHub Pages'
      // 404 redirect encoded into the query string, before the router mounts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
